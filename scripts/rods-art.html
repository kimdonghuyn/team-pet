<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>낚싯대 미리보기</title>
<style>
  :root { --bg: #14121d; --card: #1e1b2e; --edge: #2e2a45; --ink: #f1eefc; --dim: #9a93bd; --gold: #ffd27a; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Malgun Gothic', system-ui, sans-serif; }
  header { padding: 24px 16px 8px; max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  header p { margin: 0; color: var(--dim); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; padding: 16px; max-width: 1180px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--edge); border-radius: 14px; padding: 12px 14px 14px; }
  .card.t2 { border-color: #3d5a8a; } .card.t3 { border-color: #8a6ad8; box-shadow: 0 0 18px #8a6ad833; }
  .card.t4 { border-color: #f2c94c; box-shadow: 0 0 26px #f2c94c44; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name { font-weight: 800; font-size: 15px; }
  .need { font-size: 12px; color: var(--gold); white-space: nowrap; }
  .look { font-size: 12px; color: var(--dim); margin-top: 4px; min-height: 32px; }
  .stage { position: relative; height: 190px; margin-top: 6px; border-radius: 10px; background: radial-gradient(ellipse at 50% 120%, #26324a, #171525 70%); overflow: hidden; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pet { position: absolute; left: 150px; top: 112px; width: 64px; height: 64px; background: url('fox.png') 0 0 / 256px 64px no-repeat; image-rendering: pixelated; }
  .bonus { margin-top: 8px; font-size: 12px; }
  .bonus b { color: #7ee0c8; }
  .tw { animation: tw 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .tw.b { animation-delay: .45s; } .tw.c { animation-delay: .9s; }
  @keyframes tw { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
  .glow { animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  .aurora { animation: hue 4s linear infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  .flame { animation: fl .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  .flame.b { animation-duration: .45s; } .flame.c { animation-duration: .3s; }
  @keyframes fl { from { transform: scaleY(.7) translateY(1px); opacity: .7; } to { transform: scaleY(1.2); opacity: 1; } }
  .bob { animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(2px); } }
  .spin { animation: spin 5s linear infinite; transform-box: view-box; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinSlow { animation: sway2 6s ease-in-out infinite; }
  @keyframes sway2 { 50% { transform: rotate(8deg); } }
  .sway { animation: sway 3s ease-in-out infinite; }
  @keyframes sway { 50% { transform: translateX(6px); } }
</style>
</head>
<body>
<header>
  <h1>🎣 도감 낚싯대 15단계 미리보기</h1>
  <p>단계가 오를수록 화려해집니다. 크게 그린 모습이고, 실제 펫 화면에서는 펫 크기에 맞춰 작게 보입니다. 빛·입자·불꽃은 움직입니다.</p>
</header>
<div class="grid" id="grid"></div>
<script>
const H = { x: 168, y: 140 }, T = { x: 58, y: 34 }, P = { x: 62, y: 166 };
const LEN = Math.hypot(T.x - H.x, T.y - H.y), D = { x: (T.x - H.x) / LEN, y: (T.y - H.y) / LEN }, N = { x: -D.y, y: D.x };
const at = (t, off = 0) => ({ x: H.x + (T.x - H.x) * t + N.x * off, y: H.y + (T.y - H.y) * t + N.y * off });
const pole = (color, w = 5, extra = '') => `<line x1="${H.x}" y1="${H.y}" x2="${T.x}" y2="${T.y}" stroke="${color}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
const grip = (color, w = 8) => `<line x1="${H.x + 4}" y1="${H.y + 4}" x2="${H.x - 22}" y2="${H.y - 22}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
const line = (color = '#dde6f2', w = 1.4, extra = '') => `<path class="water" d="M ${T.x} ${T.y} Q ${T.x - 8} ${(T.y + P.y) / 2 + 10} ${P.x} ${P.y - 7}" fill="none" stroke="${color}" stroke-width="${w}" ${extra}/>`;
const pond = (fill = '#6fa3da', edge = '#4f7fb8') => `<ellipse class="water" cx="${P.x}" cy="${P.y}" rx="34" ry="8" fill="${fill}" opacity=".85" stroke="${edge}"/><ellipse class="water" cx="${P.x - 10}" cy="${P.y - 2}" rx="10" ry="1.5" fill="#fff" opacity=".6"/>`;
const bobber = (top = '#e5484d', bottom = '#f2f2f2') => `<g class="bob water"><circle cx="${P.x}" cy="${P.y - 5}" r="6" fill="${bottom}" stroke="#0006" stroke-width=".8"/><path d="M ${P.x - 6} ${P.y - 5} A 6 6 0 0 1 ${P.x + 6} ${P.y - 5} Z" fill="${top}"/></g>`;
const star = (x, y, c, s = 5, cls = '') => `<path class="tw ${cls}" d="M ${x} ${y - s} L ${x + s * .3} ${y - s * .3} L ${x + s} ${y} L ${x + s * .3} ${y + s * .3} L ${x} ${y + s} L ${x - s * .3} ${y + s * .3} L ${x - s} ${y} L ${x - s * .3} ${y - s * .3} Z" fill="${c}"/>`;
const rings = (c, n = 5, w = 7, from = 0.25, step = 0.15) => Array.from({ length: n }, (_, i) => { const a = at(from + i * step, -w / 2), b = at(from + i * step, w / 2); return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/>`; }).join('');
// A bright streak running up the pole now and then: polished.
const shine = (dur = 2.4, c = '#fff', w = 2) => `<line x1="${H.x}" y1="${H.y}" x2="${T.x}" y2="${T.y}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="16 260" opacity=".8"><animate attributeName="stroke-dashoffset" from="20" to="-260" dur="${dur}s" repeatCount="indefinite"/></line>`;
// A soft halo round the pole.
const aura = (c, w = 16, id) => `<defs><filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs><g class="glow">${pole(c, w, `filter="url(#${id})" opacity=".7"`)}</g>`;
// Little things rising (bubbles, embers) or drifting down (stars), each on its own beat.
const rise = (pts, c, r, dy, dur, shape = 'circle') => pts.map(([x, y], i) => {
  const begin = (i * dur / pts.length).toFixed(2);
  const body = shape === 'circle' ? `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"` : `<path d="M ${x} ${y - r} L ${x + r * .35} ${y - r * .35} L ${x + r} ${y} L ${x + r * .35} ${y + r * .35} L ${x} ${y + r} L ${x - r * .35} ${y + r * .35} L ${x - r} ${y} L ${x - r * .35} ${y - r * .35} Z" fill="${c}"`;
  return `<g>${body} opacity="0"><animate attributeName="opacity" values="0;1;0" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></${shape === 'circle' ? 'circle' : 'path'}><animateTransform attributeName="transform" type="translate" values="0 0;0 ${dy}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></g>`;
}).join('');
const bg = (id, inner, outer) => `<defs><radialGradient id="${id}" cx=".45" cy=".35" r=".8"><stop offset="0" stop-color="${inner}"/><stop offset="1" stop-color="${outer}" stop-opacity="0"/></radialGradient></defs><rect class="water" width="250" height="190" fill="url(#${id})"/>`;
// A body wound round the pole: a sine along it.
const coil = (from, to, amp, turns, n = 60) => Array.from({ length: n + 1 }, (_, i) => { const t = from + (to - from) * i / n; const p = at(t, Math.sin((t - from) / (to - from) * Math.PI * 2 * turns) * amp); return `${i ? 'L' : 'M'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`; }).join(' ');

const RODS = [
  { tier: 1, need: '처음', name: '🪵 초보 낚싯대', look: '갈색 나무 막대, 빨간 찌', bonus: '기본',
    svg: () => pond() + pole('#9c6b3e') + grip('#4a3424') + line() + bobber() },
  { tier: 1, need: '5종', name: '🎋 청죽', look: '초록 대나무, 마디마다 연두 고리', bonus: '+3%',
    svg: () => pond() + pole('#4f9a45', 6) + rings('#a8d88a') + grip('#2f5e2a') + line() + bobber() },
  { tier: 1, need: '10종', name: '🪶 바람깃', look: '끝에 흰 깃털이 바람에 흔들림', bonus: '+6%',
    svg: () => pond() + pole('#c9a27e') + grip('#6b4a30') + line('#e8eef8') +
      `<g transform="translate(${T.x} ${T.y}) rotate(-60)"><g><animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="1.6s" repeatCount="indefinite"/><path d="M 0 0 C 6 -6 18 -8 26 -2 C 18 0 8 3 0 0 Z" fill="#fff"/><path d="M 0 0 L 24 -2" stroke="#cfd8e6" stroke-width="1"/></g></g>` + bobber('#5b8def', '#ffffff') },
  { tier: 2, need: '15종', name: '⚓ 강철 닻', look: '은회색 금속에 광택이 흐름, 가죽 손잡이, 릴', bonus: '+9%',
    svg: () => pond() + `<defs><linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#c3ccd6"/><stop offset="1" stop-color="#5c6670"/></linearGradient></defs>` +
      pole('url(#st)', 5) + shine(2.6) + grip('#7a4b2a', 9) + rings('#4a2f1a', 2, 9, 0.04, 0.07) +
      `<circle cx="${H.x - 30}" cy="${H.y - 18}" r="7" fill="#8a949e" stroke="#3c444c" stroke-width="2"/><g class="spin" style="transform-origin:${H.x - 30}px ${H.y - 18}px"><line x1="${H.x - 30}" y1="${H.y - 23}" x2="${H.x - 30}" y2="${H.y - 13}" stroke="#3c444c" stroke-width="1.5"/></g>` + line('#c8d0da') + bobber() },
  { tier: 2, need: '20종', name: '🌊 심해 카본', look: '남색 광택, 파랗게 빛나는 찌, 물에서 거품이 올라옴', bonus: '+12%',
    svg: () => pond('#3f74b8', '#2a5590') + `<defs><filter id="bl"><feGaussianBlur stdDeviation="3"/></filter></defs>` + pole('#1e2a4a', 6) + shine(2, '#9fd8ff') + grip('#0f1626') + line('#9fd8ff') +
      `<g class="water">${rise([[P.x - 18, P.y - 4], [P.x + 14, P.y - 2], [P.x - 4, P.y - 6], [P.x + 24, P.y - 4]], '#bfe8ff', 2.2, -40, 2.4)}` +
      `<circle class="glow" cx="${P.x}" cy="${P.y - 5}" r="11" fill="#4fc3f7" filter="url(#bl)"/></g>` + bobber('#4fc3f7', '#e8f8ff') },
  { tier: 2, need: '30종', name: '🍃 비취 용골', look: '옥색 반투명, 마디마다 빛, 잎사귀가 막대 둘레를 맴돎', bonus: '+16%',
    svg: () => pond('#5fb8a0', '#3d8f78') + aura('#6fcfb0', 12, 'a6') + pole('#6fcfb0', 6, 'opacity=".9"') +
      Array.from({ length: 4 }, (_, i) => { const p = at(.3 + i * .17); return `<circle class="glow" cx="${p.x}" cy="${p.y}" r="2.6" fill="#e6fff6"/>`; }).join('') +
      grip('#2e7d68') + line('#cffff0') +
      [0, 1, 2].map((i) => { const p = at(.35 + i * .22); return `<g transform="translate(${p.x} ${p.y})"><g><animateTransform attributeName="transform" type="rotate" from="${i * 120}" to="${i * 120 + 360}" dur="3s" repeatCount="indefinite"/><path d="M 12 0 q 5 -4 9 0 q -5 4 -9 0 Z" fill="#8ff0c8"/></g></g>`; }).join('') + bobber('#2ea886', '#e6fff6') },
  { tier: 3, need: '40종', name: '🌙 월광', look: '은빛 막대에 달빛 오라, 끝에 초승달, 별이 떨어짐', bonus: '+20%',
    svg: () => bg('g7', '#2a3358', '#171525') + pond('#7f8fc8', '#5a6aa8') + aura('#dfe8ff', 14, 'a7') + pole('#e6ebf3', 5) + shine(1.8) + grip('#7c8696') + line('#eef3ff', 1.6) +
      `<g class="glow"><path d="M ${T.x - 4} ${T.y - 16} a 12 12 0 1 0 13 20 a 9.5 9.5 0 1 1 -13 -20 Z" fill="#fff6c8"/></g>` +
      rise([[T.x + 30, 10], [T.x + 70, 20], [T.x - 20, 6], [T.x + 110, 14]], '#fff6c8', 3.5, 60, 2.6, 'star') + bobber('#b8c4ff', '#ffffff') },
  { tier: 3, need: '50종', name: '☀️ 태양의 금장', look: '황금 막대에 금빛 오라, 끝에서 도는 태양, 금빛 줄과 반짝이', bonus: '+25%',
    svg: () => bg('g8', '#4a3a14', '#171525') + pond('#c9a24c', '#9a7a2a') + `<defs><linearGradient id="gd" x1="0" x2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".5" stop-color="#f2c94c"/><stop offset="1" stop-color="#b8861f"/></linearGradient></defs>` +
      aura('#ffd166', 16, 'a8') + pole('url(#gd)', 6) + shine(1.6) + grip('#7a1f1f', 9) + line('#ffe08a', 1.8) +
      `<g class="spin" style="transform-origin:${T.x}px ${T.y}px">${Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4; return `<line x1="${T.x + Math.cos(a) * 9}" y1="${T.y + Math.sin(a) * 9}" x2="${T.x + Math.cos(a) * 15}" y2="${T.y + Math.sin(a) * 15}" stroke="#ffd166" stroke-width="2.2" stroke-linecap="round"/>`; }).join('')}</g><circle cx="${T.x}" cy="${T.y}" r="7" fill="#ffe08a" stroke="#f2a93b" stroke-width="1.5"/>` +
      star(at(.6).x + 12, at(.6).y - 8, '#fff2b0', 5) + star(at(.35).x + 14, at(.35).y + 2, '#fff2b0', 4, 'b') + star(T.x + 30, T.y + 20, '#fff2b0', 4, 'c') + bobber('#f2c94c', '#fff8e1') },
  { tier: 3, need: '65종', name: '💎 수정 결정', look: '보라 결정 막대, 끝 둘레를 결정 조각이 공전, 빛이 갈라짐', bonus: '+30%',
    svg: () => bg('g9', '#3a2458', '#171525') + pond('#9a7ad8', '#6a4ab8') + aura('#c4a8ff', 16, 'a9') + pole('#b48cf0', 7, 'opacity=".85"') + `<line x1="${H.x}" y1="${H.y}" x2="${T.x}" y2="${T.y}" stroke="#f0e6ff" stroke-width="1.6" opacity=".7"/>` + shine(1.5, '#fff', 2.5) + grip('#5b3c8c') + line('#e9dcff', 1.6) +
      `<g transform="translate(${T.x} ${T.y})"><polygon points="0,-16 7,-2 0,5 -7,-2" fill="#d9c4ff" stroke="#8f6ad8"/></g>` +
      `<g><animateTransform attributeName="transform" type="rotate" from="0 ${T.x} ${T.y}" to="360 ${T.x} ${T.y}" dur="4s" repeatCount="indefinite"/>${[0, 1, 2, 3].map((i) => { const a = i * Math.PI / 2; const x = T.x + Math.cos(a) * 20, y = T.y + Math.sin(a) * 20; return `<polygon points="${x},${y - 6} ${x + 4},${y} ${x},${y + 6} ${x - 4},${y}" fill="${['#e7dbff', '#c4a8ff', '#ffd6f5', '#bfe8ff'][i]}" stroke="#8f6ad8" stroke-width=".8"/>`; }).join('')}</g>` +
      star(at(.5).x - 12, at(.5).y - 10, '#f3e8ff', 4) + star(T.x + 34, T.y + 30, '#f3e8ff', 3, 'b') + star(at(.3).x + 14, at(.3).y, '#ffd6f5', 3, 'c') + bobber('#b48cf0', '#f6f0ff') },
  { tier: 4, need: '80종', name: '🌈 오로라', look: '하늘에 오로라 커튼이 일렁이고, 막대·줄·찌가 무지개로 흐름', bonus: '+35%',
    svg: () => `<defs><linearGradient id="au" gradientUnits="userSpaceOnUse" x1="${H.x}" y1="${H.y}" x2="${T.x}" y2="${T.y}"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".25" stop-color="#ffd166"/><stop offset=".5" stop-color="#7bd389"/><stop offset=".75" stop-color="#5dadec"/><stop offset="1" stop-color="#b48cf0"/></linearGradient><linearGradient id="cur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7bd389" stop-opacity=".0"/><stop offset=".4" stop-color="#7bd389" stop-opacity=".45"/><stop offset="1" stop-color="#5dadec" stop-opacity="0"/></linearGradient><filter id="cb"><feGaussianBlur stdDeviation="4"/></filter></defs>` +
      
      `<g class="aurora">${pond('#7bd3c0', '#5dadec')}${aura('#9ff0d0', 18, 'a10')}${pole('url(#au)', 7)}${line('url(#au)', 2.2)}</g>` + shine(1.3, '#fff', 2.5) + grip('#2a2540') +
      rise([[40, 60], [90, 40], [140, 70], [200, 50], [230, 80]], '#ffffff', 3, 40, 3, 'star') + `<g class="aurora">${bobber('#ff6b6b', '#ffffff')}</g>` },
  { tier: 4, need: '100종', name: '🐉 흑룡의 숨결', look: '금빛 장식의 검은 성검 같은 막대에 붉은 불씨 보석, 붉은 연기 용이 은은하게 휘감아 오르고 금빛 고리가 보석 둘레를 돎', bonus: '+40%',
    svg: () => {
      // Drawn in the rod's own frame: x runs from the hand (0) to the tip (L), y across it.
      const dx = T.x - H.x, dy = T.y - H.y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      const tip = { x: H.x + ux * (L + 24), y: H.y + uy * (L + 24) };
      const ln = `M ${tip.x} ${tip.y} Q ${tip.x - 14} ${(tip.y + P.y) / 2} ${P.x} ${P.y - 10}`;
      const gem = (x, r, k) => `<path d="M ${x - r} 0 L ${x} ${-r * .8} L ${x + r} 0 L ${x} ${r * .8} Z" fill="url(#emb)" stroke="#ffe08a" stroke-width=".7"/>` +
        `<path d="M ${x - r} 0 L ${x} ${-r * .8} L ${x + r} 0 L ${x} ${r * .8} Z" fill="#ffb070" opacity="0" filter="url(#sb)"><animate attributeName="opacity" values="0;.9;0" dur="2.4s" begin="${k * .5}s" repeatCount="indefinite"/></path>`;
      const curl = (x, s) => `<path d="M ${x} ${s * 4} C ${x + 1} ${s * 7} ${x + 6} ${s * 7.5} ${x + 7} ${s * 5} C ${x + 7.3} ${s * 3.8} ${x + 5.5} ${s * 3.5} ${x + 5} ${s * 4.6}" fill="none" stroke="url(#gv)" stroke-width="1.5" stroke-linecap="round"/>`;
      const wing = (s) => `<path d="M 33 ${s * 3} C 30 ${s * 10} 25 ${s * 16} 17 ${s * 20} C 27 ${s * 19} 36 ${s * 13} 40 ${s * 5} Z" fill="url(#gv)" stroke="#3a1a04" stroke-width=".8"/>` +
        `<path d="M 31 ${s * 6} C 29 ${s * 11} 26 ${s * 14} 22 ${s * 17}" fill="none" stroke="#ff4a2a" stroke-width="1.1" opacity=".9"/>`;
      const crestWing = (s) => `<path d="M ${L} ${s * 4} C ${L - 5} ${s * 12} ${L + 4} ${s * 16} ${L + 9} ${s * 10} C ${L + 6} ${s * 10} ${L + 4} ${s * 8} ${L + 5} ${s * 5} Z" fill="url(#gv)" stroke="#3a1a04" stroke-width=".7"/>`;
      // The smoke dragon: a ribbon spiralling up the rod, widening as it rises, its head a curl of flame past the tip.
      const N0 = 90, sp = Array.from({ length: N0 + 1 }, (_, i) => { const u = i / N0, th = u * Math.PI * 2 * 2.1 + .4; return { x: 8 + (L + 2) * u, y: Math.sin(th) * (5 + 13 * u), front: Math.cos(th) > 0, u }; });
      const path = (pp) => pp.map((p, i) => `${i ? 'L' : 'M'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
      const fronts = []; let cur = []; sp.forEach((p) => { if (p.front) cur.push(p); else if (cur.length) { fronts.push(cur); cur = []; } }); if (cur.length) fronts.push(cur);
      const e = sp[N0], hx = e.x, hy = e.y, sg = hy >= 0 ? 1 : -1;
      const head = `M ${hx} ${hy} C ${hx + 8} ${hy + sg * 2} ${hx + 16} ${hy - sg * 2} ${hx + 22} ${hy - sg * 10} M ${hx + 4} ${hy} C ${hx + 10} ${hy + sg * 8} ${hx + 18} ${hy + sg * 8} ${hx + 26} ${hy + sg * 4} M ${hx + 8} ${hy - sg * 2} C ${hx + 12} ${hy - sg * 10} ${hx + 8} ${hy - sg * 16} ${hx + 2} ${hy - sg * 20} M ${hx + 12} ${hy - sg * 3} C ${hx + 20} ${hy - sg * 10} ${hx + 20} ${hy - sg * 18} ${hx + 14} ${hy - sg * 24}`;
      const smoke = path(sp);
      return bg('g11', '#3a1418', '#0d0a0c') + pond('#8a3a3a', '#5a2024') +

  { name: '❄️ 빙결', look: '푸른 얼음 결정 막대, 끝에 서리 결정, 눈송이가 내림', svg: () => bg('g12', '#1c3550', '#171525') + pond('#a8d8f0', '#6aa8d0') +
      aura('#bfe8ff', 12, 'a12') + pole('#cfefff', 6, 'opacity=".9"') + `<line x1="${H.x}" y1="${H.y}" x2="${T.x}" y2="${T.y}" stroke="#7fc8ef" stroke-width="1.4" stroke-dasharray="6 4"/>` + shine(2.2) + grip('#3a6a8a') + line('#e6f6ff') +
      `<g transform="translate(${T.x} ${T.y})">${[0, 60, 120].map((a) => `<line x1="-10" y1="0" x2="10" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round" transform="rotate(${a})"/>`).join('')}<circle r="2.5" fill="#bfe8ff"/></g>` +
      rise([[40, 10], [90, 4], [150, 12], [200, 6], [120, 0]], '#ffffff', 2, 70, 3.4) + bobber('#7fc8ef', '#ffffff') },
  { name: '🔥 불꽃 단조', look: '달군 쇠처럼 주황빛으로 달아오른 막대, 불똥이 튐', svg: () => bg('g13', '#3a1a0e', '#171525') + pond('#c8784a', '#8a4a2a') +
      `<defs><linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="${H.x}" y1="${H.y}" x2="${T.x}" y2="${T.y}"><stop offset="0" stop-color="#5a2a1a"/><stop offset=".5" stop-color="#ff7a2a"/><stop offset="1" stop-color="#ffe08a"/></linearGradient></defs>` +
      aura('#ff8a3d', 14, 'a13') + pole('url(#hot)', 6) + shine(1.8, '#fff2b0') + grip('#2a140c') + rings('#3a1a0e', 3, 8, .35, .2) + line('#ffc27a') +
      rise([[T.x, T.y], [at(.3).x, at(.3).y], [at(.6).x, at(.6).y], [T.x + 10, T.y + 6], [at(.8).x, at(.8).y]], '#ffd166', 1.6, -30, 1.2) + bobber('#ff7a2a', '#fff2e0') },
  { name: '⚡ 뇌전', look: '푸른 막대에 번개가 지직거리며 타고 흐름', svg: () => bg('g14', '#1a2a5a', '#171525') + pond('#6a8ae8', '#3a5ab8') +
      aura('#7fb2ff', 16, 'a14') + pole('#2a3a7a', 6) + shine(1.1, '#e6f0ff', 2.5) + grip('#121a3a') + line('#cfe0ff', 1.6) +
      [0, 1].map((k) => { const pts = Array.from({ length: 9 }, (_, i) => { const p = at(.1 + i * .1, (i % 2 ? 1 : -1) * (5 + k * 2)); return `${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(' '); return `<polyline points="${pts}" fill="none" stroke="${k ? '#ffffff' : '#9fd0ff'}" stroke-width="${k ? 1 : 2}" opacity="0"><animate attributeName="opacity" values="0;1;0;0;1;0;0" dur="${1.1 + k * .4}s" repeatCount="indefinite"/></polyline>`; }).join('') +

      star(40, 30, '#fff', 3) + star(200, 40, '#fff', 3, 'b') + star(150, 20, '#fff', 2.5, 'c') + star(30, 110, '#fff', 2.5, 'b') + bobber('#b48cf0', '#f6f0ff') },

// 15 steps, rarer ones a little likelier at each; reordered and renumbered here in one place.
const STEPS = [
  ['🪵 초보 낚싯대', '처음', '기본'], ['🎋 청죽', '3종', '+2%'], ['🪶 바람깃', '6종', '+4%'], ['⚓ 강철 닻', '10종', '+7%'],
  ['🌊 심해 카본', '15종', '+10%'], ['🍃 비취 용골', '20종', '+13%'], ['❄️ 빙결', '26종', '+16%'], ['🔥 불꽃 단조', '33종', '+19%'],
  ['🌙 월광', '40종', '+22%'], ['☀️ 태양의 금장', '48종', '+25%'], ['⚡ 뇌전', '57종', '+28%'], ['💎 수정 결정', '67종', '+31%'],
  ['🌈 오로라', '78종', '+34%'], ['🌌 은하수', '90종', '+37%'], ['🐉 흑룡의 숨결', '100종', '+40%'],
];

const curtain = (id, c1, c2, blur = 5, top = 4, h = 90, cls = 'sway') => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}" stop-opacity="0"/><stop offset=".35" stop-color="${c1}" stop-opacity=".55"/><stop offset=".7" stop-color="${c2}" stop-opacity=".35"/><stop offset="1" stop-color="${c2}" stop-opacity="0"/></linearGradient><filter id="${id}f"><feGaussianBlur stdDeviation="${blur}"/></filter></defs>` +

// The sky goes over the rod's own background (its first rect) and under everything else.
const withSky = (r) => { const s = r.svg(), b = BACK[r.name]; if (!b) return s; const k = s.indexOf('height="190" fill="url(#'); if (k < 0) return b() + s; const e = s.indexOf('/>', k) + 2; return s.slice(0, e) + b() + s.slice(e); };
// scripts/make-rods.js opens this page with ?sheet=rod|sky&i=<step> and takes a picture of FRAMES
// stills side by side, STEP ms apart (every animation stopped at its own moment): the rod alone
// (no pond, line or float: those are drawn live), or its sky faded out at the edges.
const FRAMES = 12, STEP = 200, Q = new URLSearchParams(location.search);
if (Q.has('sheet')) {
  const r = RODS[+Q.get('i')], sky = Q.get('sheet') === 'sky';
  document.head.insertAdjacentHTML('beforeend', '<style>html,body{background:transparent!important;margin:0;overflow:hidden} header,#grid{display:none} .water{display:none} svg{display:block;float:left}</style>');
  // Each still has its own ids, so a filter or gradient moves with its own still's clock.
  const own = (s, k) => s.replace(/id="([^"]+)"/g, `id="$1_${k}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${k})`);
  const fade = (k) => `<defs><radialGradient id="fd_${k}" cx=".5" cy=".55" r=".55"><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient><mask id="fm_${k}"><rect width="250" height="190" fill="url(#fd_${k})"/></mask></defs>`;
  document.body.insertAdjacentHTML('beforeend', Array.from({ length: FRAMES }, (_, k) => `<svg width="250" height="190" viewBox="0 0 250 190">${sky ? `${fade(k)}<g mask="url(#fm_${k})">${own(BACK[r.name](), k)}</g>` : own(r.svg(), k)}</svg>`).join(''));
  [...document.querySelectorAll('body > svg')].forEach((s, k) => {
    s.pauseAnimations(); s.setCurrentTime(k * STEP / 1000);
    s.getAnimations({ subtree: true }).forEach((a) => { a.pause(); a.currentTime = k * STEP; });
  });
} else
document.getElementById('grid').innerHTML = RODS.map((r) => `
  <div class="card t${r.tier}">
    <div class="top"><span class="name">${r.name}</span><span class="need">${r.need}</span></div>
    <div class="look">${r.look}</div>
    <div class="stage"><svg viewBox="0 0 250 190">${withSky(r)}</svg><div class="pet"></div></div>
    <div class="bonus">드문 물고기 확률 <b>${r.bonus}</b></div>
  </div>`).join('');
</script>
